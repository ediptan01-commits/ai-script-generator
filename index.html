<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Video Script Generator</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #0369a1;
        }

        .video-button {
            background: #16a34a;
            margin-top: 15px;
        }

        .video-button:hover {
            background: #15803d;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 4px;
            display: none;
            white-space: pre-line;
            line-height: 1.6;
        }

        .video-panel {
            margin-top: 25px;
            padding: 18px;
            background: #172033;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .video-panel h2 {
            font-size: 18px;
            margin-top: 0;
            color: #38bdf8;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            color: #cbd5e1;
            display: none;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Video Script Generator</h1>

    <p class="subtitle">
        TikTok, Reels ve Shorts için yapay zekâ ile içerik oluşturun.
    </p>

    <label for="apiKey">Gemini API Anahtarınız:</label>

    <input
        type="password"
        id="apiKey"
        placeholder="Gemini API anahtarınızı buraya yapıştırın"
    >

    <label for="topic">Videonuzun Konusu Nedir?</label>

    <input
        type="text"
        id="topic"
        placeholder="Örn: Modern Snake oyunu"
    >

    <label for="language">Hedef Dil</label>

    <select id="language">
        <option value="Turkish">Türkçe</option>
        <option value="English">English</option>
        <option value="Spanish">Español</option>
        <option value="German">Deutsch</option>
    </select>

    <button onclick="generateScript()">
        🧠 Senaryo Üret
    </button>


    <!-- VİDEO AYARLARI -->

    <div class="video-panel">

        <h2>🎬 Video Oluştur</h2>

        <label for="duration">Video Süresi</label>

        <select id="duration">
            <option value="15">15 saniye</option>
            <option value="30" selected>30 saniye</option>
            <option value="60">60 saniye</option>
        </select>


        <label for="platform">Platform</label>

        <select id="platform">
            <option value="TikTok">TikTok</option>
            <option value="Instagram Reels">Instagram Reels</option>
            <option value="YouTube Shorts">YouTube Shorts</option>
        </select>


        <label for="style">Video Tarzı</label>

        <select id="style">
            <option value="Viral">Viral</option>
            <option value="Komik">Komik</option>
            <option value="Profesyonel">Profesyonel</option>
            <option value="Hikaye">Hikâye anlatımı</option>
            <option value="Reklam">Reklam</option>
        </select>


        <button
            class="video-button"
            onclick="createVideoPlan()"
        >
            🎬 Videoyu Oluştur
        </button>

        <div id="videoStatus" class="status"></div>

    </div>


    <div id="result" class="result-box"></div>

</div>


<script src="script.js"></script>

</body>
</html>
